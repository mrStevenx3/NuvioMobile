name: Build IPA (Apple TV)

# Steven's fork: builds an UNSIGNED tvOS device IPA from this branch, to sign with
# Signulous (or any re-signer) and install on the Apple TV. Run it by hand from
# the Actions tab ("Run workflow"); the IPA is attached to the run as an artifact.
# Based on the upstream fork's tvos-sim-build.yml and scripts/release-beta.sh.
on:
  workflow_dispatch:
  # Also on every push to the tvOS branch, so a new change builds by itself.
  push:
    branches: ["tvos-shared-extraction"]

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
  KOTLIN_DAEMON_JVMARGS: -Xmx3g

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Init MPVKit submodule
        run: git submodule update --init MPVKit

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # restore + an always() save at the end, so a failed app build still keeps the
      # Gradle/Konan and quickjs caches (the plain cache action only saves on success).
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-konan-device-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-konan-device-${{ runner.os }}-
            gradle-konan-${{ runner.os }}-

      # Use the newest Xcode on the image (the upstream builds use Xcode 27.x), and say which
      # one as a run annotation (the raw log is not reachable from the agent's sandbox).
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          NEWEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          echo "::notice::Xcode in use: $(xcodebuild -version | tr '\n' ' ') | available: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk appletvos --show-sdk-version
          java -version

      # Steven's fork: the service keys live in this repo's Actions secrets (Settings > Secrets
      # and variables > Actions), never in the code. They go into local.properties, which the
      # shared module's generateSharedRuntimeConfigs task reads. Missing secrets stay blank (the
      # app then runs those features off / local-only).
      - name: Write local.properties from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          : > local.properties
          set_count=0
          for k in SUPABASE_URL SUPABASE_ANON_KEY NUVIO_SUPABASE_FALLBACK_URL TRAKT_CLIENT_ID \
                   TRAKT_CLIENT_SECRET SIMKL_CLIENT_ID MDBLIST_CLIENT_ID PREMIUMIZE_CLIENT_ID \
                   INTRODB_API_URL IMDB_RATINGS_API_BASE_URL IMDB_TAPFRAME_API_BASE_URL TMDB_API_KEY; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> local.properties; set_count=$((set_count+1)); fi
          done
          echo "::notice::local.properties: $set_count of 12 keys set (names only, values are masked)"

      # Same pinned scaffolding checkout as tvos-sim-build.yml: :shared's tvOS
      # cinterop needs the patched quickjs-kt 1.0.5-tvos in mavenLocal.
      - uses: actions/checkout@v4
        with:
          repository: youngchris29-art/NuvioTV
          ref: 6265f00ec0b19b8a1301488f2ede523c8768de84
          path: outer-scaffolding
          sparse-checkout: scaffolding

      - uses: actions/cache/restore@v4
        id: quickjs-cache
        with:
          path: ~/.m2/repository/io/github/dokar3
          key: quickjs-tvos-${{ hashFiles('outer-scaffolding/scaffolding/quickjs-kt-tvos.patch', 'outer-scaffolding/scaffolding/build-quickjs-tvos.sh') }}

      - name: Publish quickjs-kt 1.0.5-tvos to mavenLocal
        run: |
          if [ -d "$HOME/.m2/repository/io/github/dokar3/quickjs-kt/1.0.5-tvos" ]; then
            echo "quickjs-kt 1.0.5-tvos already in mavenLocal (cache hit)"
            exit 0
          fi
          bash outer-scaffolding/scaffolding/build-quickjs-tvos.sh "$HOME/quickjs-kt-tvos"

      # The Xcode build phase runs this same task; isolated here so a Kotlin
      # error shows up in its own step instead of mid-xcodebuild.
      - name: Link shared Kotlin framework (tvOS device, Release)
        run: ./gradlew :shared:linkReleaseFrameworkTvosArm64 --no-daemon --stacktrace

      - name: Save quickjs cache
        if: always() && steps.quickjs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/io/github/dokar3
          key: ${{ steps.quickjs-cache.outputs.cache-primary-key }}

      - name: Save Gradle/Konan cache
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Build NuvioTV (tvOS device, Release, unsigned)
        run: |
          set -o pipefail
          status=0
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme NuvioTV \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -derivedDataPath iosApp/build/tvos-ipa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            NUVIO_BETA_TAG="steven-$(git rev-parse --short=8 HEAD)" \
            > xcodebuild.log 2>&1 || status=$?
          tail -60 xcodebuild.log
          if [ "$status" -ne 0 ]; then
            # Surface the compiler errors as run annotations (readable from the API
            # without the raw log): 10 as errors, the next 10 as warnings, 10 notices.
            grep -E "(error|fatal error): " xcodebuild.log \
              | sed -E "s#^.*/iosApp/##" | awk '!seen[$0]++' > errors.txt || true
            if [ ! -s errors.txt ]; then
              grep -E "\*\* BUILD FAILED|Command .* failed|failed with" xcodebuild.log \
                | awk '!seen[$0]++' | head -30 > errors.txt || true
            fi
            n=0
            while IFS= read -r line; do
              msg="$(printf '%s' "$line" | cut -c1-900 | sed 's/%/%25/g')"
              if [ $n -lt 10 ]; then echo "::error::$msg"
              elif [ $n -lt 20 ]; then echo "::warning::$msg"
              else echo "::notice::$msg"; fi
              n=$((n+1))
            done < <(head -30 errors.txt)
            exit "$status"
          fi

      - name: Package IPA
        run: |
          set -euo pipefail
          PRODUCTS="iosApp/build/tvos-ipa/Build/Products/Release-appletvos"
          APP="$(ls -d "$PRODUCTS"/*.app | head -1)"
          echo "App: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NuvioCommitSHA' "$APP/Info.plist" || true
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          # Same as release-beta.sh: re-signers mangle the Top Shelf appex and
          # tvOS kills it on launch, so the PlugIns folder is dropped.
          rm -rf "out/Payload/$(basename "$APP")/PlugIns"
          (cd out && zip -qry NuvioTV.ipa Payload)
          ls -lh out/NuvioTV.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-ipa
          path: out/NuvioTV.ipa
          retention-days: 1
          compression-level: 0
